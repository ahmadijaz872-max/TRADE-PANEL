<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Investor Trader Panel</title>
    <!-- [STYLES REMAIN SAME AS PREVIOUS - COPY PASTE YOUR EXISTING STYLES HERE TO KEEP UI IDENTICAL] -->
    <!-- (I am including styles briefly below to ensure it works) -->
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: radial-gradient(circle at 50% 50%, #0c1825, #080b10); color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow-x: hidden; }
        .top-ticker { width: 100%; background-color: #FFD700; color: #000000; font-weight: 800; font-size: 11px; padding: 7px 0; overflow: hidden; white-space: nowrap; position: sticky; top: 0; z-index: 1000; }
        .ticker-text { display: inline-block; padding-left: 100%; animation: ticker 16s linear infinite; }
        @keyframes ticker { 0% { transform: translate3d(0, 0, 0); } 100% { transform: translate3d(-100%, 0, 0); } }
        .main-wrapper { width: 100%; max-width: 420px; padding: 14px 14px 90px 14px; z-index: 1; }
        .btn { width: 100%; padding: 14px; border-radius: 10px; border: none; background: linear-gradient(135deg, #0284c7, #0891b2); color: white; font-weight: 700; cursor: pointer; margin-bottom: 10px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 2000; padding: 15px; }
        .modal-content { background: #0f172a; padding: 20px; border-radius: 16px; text-align: center; max-width: 380px; width: 100%; border: 1px solid #1e293b; }
    </style>
</head>
<body>

<div class="top-ticker"><div class="ticker-text">🚀 SPECIAL OFFER: DEPOSIT $200 AND GET AN INSTANT $5 BONUS! 🚀</div></div>
<div id="stars-container"></div>

<!-- Registration Screen -->
<div class="main-wrapper" id="auth-screen">
    <h2 style="color:#38bdf8; text-align:center;">SIGN UP</h2>
    <input type="text" id="reg-fname" class="input-control" placeholder="First Name" style="width:100%; padding:12px; margin:5px 0;">
    <input type="text" id="reg-lname" class="input-control" placeholder="Last Name" style="width:100%; padding:12px; margin:5px 0;">
    <input type="email" id="reg-email" class="input-control" placeholder="Email" style="width:100%; padding:12px; margin:5px 0;">
    <input type="tel" id="reg-phone" class="input-control" placeholder="Phone" style="width:100%; padding:12px; margin:5px 0;">
    <button class="btn" onclick="handleRegistration()">Register</button>
</div>

<!-- Main Dashboard -->
<div class="main-wrapper" id="main-dashboard" style="display:none;">
    <div class="card">
        <h1 id="active-asset-price">$4203.00</h1>
    </div>
    <button class="btn" onclick="handleMiningClick()">🚀 MINE (15s CHART)</button>
    <button class="btn" style="background:#059669;" onclick="depositRequest()">Add Funds (Notify Admin)</button>
</div>

<script>
    // 1. Google Sheet Script URL (Aapka URL yahan paste hai)
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwKEpfb4QBTPwaw0wwY6FnQRpWTbVm8nETMrStGbhSHJ5yPN4gberYzVwO9Jtap4LA/exec";

    // 2. Data Sender Function
    function sendDataToSheet(name, email, phone, action, amount = "-") {
        fetch(GOOGLE_SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name, email, phone, action, amount })
        });
    }

    // 3. Register Handler
    function handleRegistration() {
        const fname = document.getElementById('reg-fname').value;
        const lname = document.getElementById('reg-lname').value;
        const email = document.getElementById('reg-email').value;
        const phone = document.getElementById('reg-phone').value;
        
        sendDataToSheet(fname + " " + lname, email, phone, "SIGNUP");
        localStorage.setItem('traderUser', JSON.stringify({fname, lname, email, phone}));
        location.reload();
    }

    // 4. Deposit Handler
    function depositRequest() {
        let user = JSON.parse(localStorage.getItem('traderUser'));
        sendDataToSheet(user.fname, user.email, user.phone, "DEPOSIT_REQUEST", "$100");
        alert("Request sent to Admin!");
    }

    // Check Auth
    if(localStorage.getItem('traderUser')) {
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('main-dashboard').style.display = 'block';
    }
</script>

</body>
</html>
