<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Trade Panel Application</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 450px;
      background: #1e293b;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #38bdf8;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-size: 14px;
      color: #94a3b8;
    }
    input {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #334155;
      background-color: #0f172a;
      color: #fff;
      font-size: 14px;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #0284c7;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      transition: 0.3s;
    }
    button:hover {
      background-color: #0369a1;
    }
    .status-card {
      background: #334155;
      padding: 15px;
      border-radius: 8px;
      margin-top: 20px;
    }
    .status-card p {
      font-size: 13px;
      margin-bottom: 5px;
      color: #cbd5e1;
    }
    #msg {
      margin-top: 10px;
      font-size: 13px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Smart Trade Panel</h2>

    <!-- User Details Section -->
    <div class="form-group">
      <label for="email">User Email (Sheet Sync)</label>
      <input type="email" id="email" placeholder="Enter your email" required>
    </div>

    <div class="form-group">
      <label for="name">Full Name</label>
      <input type="text" id="name" placeholder="Enter full name">
    </div>

    <div class="form-group">
      <label for="phone">Phone Number</label>
      <input type="text" id="phone" placeholder="Enter phone number">
    </div>

    <button onclick="registerUser()">Register New Account</button>
    
    <div style="margin-top: 20px; border-top: 1px solid #334155; padding-top: 15px;">
      <div class="form-group">
        <label for="amount">Withdrawal Amount ($)</label>
        <input type="number" id="amount" placeholder="50.00">
      </div>
      <button style="background-color: #16a34a;" onclick="requestWithdrawal()">Request Withdrawal</button>
    </div>

    <div class="status-card">
      <p><strong>App Status:</strong> <span id="appState" style="color: #4ade80;">Active (Online)</span></p>
      <p><strong>Auto System:</strong> App band hote hi Sheet mein <code>Offline (Last Seen)</code> auto-update ho jayega.</p>
    </div>

    <div id="msg"></div>
  </div>

  <script>
    // Updated Apps Script Deployment URL
    const API_URL = "https://script.google.com/macros/s/AKfycbzVYmxFwN6WcoSG65aab8Ysw4SMjBA79KivVHPIwXol8hh9ki8zuuEI2C4AWaQFRpRQtw/exec";

    // 1. App Open Hone Par Auto Online Status (Active)
    function setOnlineStatus() {
      const email = document.getElementById("email").value;
      if (!email) return;

      fetch(API_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          action_type: "user_online",
          email: email
        })
      });
    }

    // 2. App Band Ya Close Hone Par Auto Offline & Last Seen
    window.addEventListener("pagehide", function () {
      const email = document.getElementById("email").value;
      if (!email) return;

      const payload = JSON.stringify({
        action_type: "user_offline",
        email: email
      });

      // sendBeacon app close hote waqt request ko background mein deliver karta hai
      navigator.sendBeacon(API_URL, payload);
    });

    // Email change hote hi active status refresh karein
    document.getElementById("email").addEventListener("blur", setOnlineStatus);

    // 3. Register Function
    function registerUser() {
      const name = document.getElementById("name").value;
      const email = document.getElementById("email").value;
      const phone = document.getElementById("phone").value;
      const msg = document.getElementById("msg");

      if (!email || !name) {
        msg.style.color = "#f87171";
        msg.innerText = "Please fill Name and Email.";
        return;
      }

      msg.style.color = "#38bdf8";
      msg.innerText = "Registering user...";

      fetch(API_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          action_type: "register",
          name: name,
          email: email,
          phone: phone,
          initial_balance: 0
        })
      }).then(() => {
        msg.style.color = "#4ade80";
        msg.innerText = "User Registered & Auto-Verified in Sheet!";
        setOnlineStatus();
      }).catch(err => {
        msg.style.color = "#f87171";
        msg.innerText = "Error: " + err;
      });
    }

    // 4. Withdrawal Request Function
    function requestWithdrawal() {
      const email = document.getElementById("email").value;
      const amount = document.getElementById("amount").value;
      const msg = document.getElementById("msg");

      if (!email || !amount) {
        msg.style.color = "#f87171";
        msg.innerText = "Provide Email & Amount for withdrawal.";
        return;
      }

      msg.style.color = "#38bdf8";
      msg.innerText = "Submitting withdrawal request...";

      fetch(API_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          action_type: "request_withdrawal",
          email: email,
          amount: amount
        })
      }).then(() => {
        msg.style.color = "#4ade80";
        msg.innerText = "Withdrawal request added to Sheet as Pending!";
      }).catch(err => {
        msg.style.color = "#f87171";
        msg.innerText = "Error: " + err;
      });
    }
  </script>
</body>
</html>
