<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trade Panel</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 400px;
        }
        h2 {
            color: #00BFFF;
            text-align: center;
            margin-bottom: 20px;
            font-size: 24px;
            letter-spacing: 1px;
        }
        .card {
            background-color: #1E1E24;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 20px;
            border: 1px solid #2A2A35;
        }
        .card p {
            color: #888;
            margin: 0;
            font-size: 11px;
            letter-spacing: 0.5px;
        }
        .card h1 {
            color: #FFD700;
            margin: 5px 0 0 0;
            font-size: 32px;
        }
        .btn {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background-color: #008CBA;
            color: white;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            margin-bottom: 15px;
        }
        .btn:active {
            opacity: 0.8;
        }
        .divider {
            border-top: 1px solid #333;
            margin: 15px 0;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 14px;
        }
        .stat-label {
            color: #aaa;
        }
        .stat-val {
            color: #00E676;
            font-weight: bold;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .btn-green {
            background-color: #00A86B;
        }
        .btn-blue {
            background-color: #008080;
        }
        .info-box {
            background-color: #1E293B;
            border: 1px solid #38BDF8;
            color: #38BDF8;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 15px;
        }
        .progress-bar {
            width: 100%;
            background-color: #333;
            border-radius: 5px;
            overflow: hidden;
            margin-top: 10px;
        }
        .progress-fill {
            height: 8px;
            background-color: #00BFFF;
            width: 0%;
            transition: width 1s linear;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #1E1E24;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            max-width: 300px;
            border: 1px solid #444;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>INVESTOR TRADER PANEL</h2>

    <div class="card">
        <p>GOLD (XAU/USD) REAL-TIME</p>
        <h1>$2,401.66</h1>
    </div>

    <div id="mining-section">
        <button class="btn" onclick="startMining()">🚀 MINE (30s CHART)</button>
    </div>

    <div class="divider"></div>

    <div class="stat-row"><span class="stat-label">Current Amount</span><span class="stat-val">$10,500.00</span></div>
    <div class="stat-row"><span class="stat-label">Deposit Amount</span><span class="stat-val">$8,000.00</span></div>
    <div class="stat-row"><span class="stat-label">Live Equity</span><span class="stat-val">$11,250.50</span></div>
    <div class="stat-row"><span class="stat-label">Live Withdrawal</span><span class="stat-val">$2,500.00</span></div>

    <div class="divider"></div>

    <div class="btn-group">
        <button class="btn btn-green" onclick="showModal('Deposit Address: 0x71C...4f9')">Add Funds</button>
        <button class="btn btn-blue" onclick="showModal('Legal Terms & Rules Document')">Rules & Legal PDF</button>
    </div>
</div>

<div id="modal" class="modal" onclick="closeModal()">
    <div class="modal-content" id="modal-text"></div>
</div>

<script>
    function startMining() {
        const section = document.getElementById('mining-section');
        section.innerHTML = `
            <div class="info-box">
                <div>⚡ LIVE CANDLESTICK CHART MINING IN PROGRESS...</div>
                <h3 id="timer" style="margin: 10px 0; color: #fff;">Time Remaining: 30s</h3>
                <div class="progress-bar"><div id="p-fill" class="progress-fill"></div></div>
            </div>
        `;

        let time = 30;
        const timerElem = document.getElementById('timer');
        const fillElem = document.getElementById('p-fill');

        const interval = setInterval(() => {
            time--;
            timerElem.innerText = `Time Remaining: ${time}s`;
            fillElem.style.width = ((30 - time) / 30 * 100) + '%';

            if (time <= 0) {
                clearInterval(interval);
                section.innerHTML = `
                    <div class="info-box" style="border-color: #4ADE80; color: #4ADE80;">
                        🎉 SUCCESS! You Have Successfully Made $1
                    </div>
                    <button class="btn" onclick="resetMining()">Back to Dashboard</button>
                `;
            }
        }, 1000);
    }

    function resetMining() {
        document.getElementById('mining-section').innerHTML = `
            <button class="btn" onclick="startMining()">🚀 MINE (30s CHART)</button>
        `;
    }

    function showModal(msg) {
        document.getElementById('modal-text').innerText = msg;
        document.getElementById('modal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('modal').style.display = 'none';
    }
</script>

</body>
</html>
