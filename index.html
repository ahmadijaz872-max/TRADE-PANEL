<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Investor Trader Panel</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            background: radial-gradient(circle at 50% 50%, #0c1825, #080b10); 
            color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; 
            margin: 0; padding: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; 
        }

        /* Stars Background */
        .bg-particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        .star { position: absolute; background: #ffffff; border-radius: 50%; opacity: 0.3; animation: twinkle var(--duration) infinite ease-in-out; }
        @keyframes twinkle { 0%, 100% { opacity: 0.2; transform: scale(0.8); } 50% { opacity: 0.8; transform: scale(1.2); } }

        /* Ticker & Wrapper */
        .top-ticker { width: 100%; background-color: #FFD700; color: #000000; font-weight: 800; font-size: 11px; padding: 7px 0; overflow: hidden; white-space: nowrap; position: sticky; top: 0; z-index: 1000; }
        .ticker-text { display: inline-block; padding-left: 100%; animation: ticker 16s linear infinite; }
        @keyframes ticker { 0% { transform: translate3d(0, 0, 0); } 100% { transform: translate3d(-100%, 0, 0); } }
        .main-wrapper { width: 100%; max-width: 420px; padding: 16px; z-index: 1; }

        /* Auth Screen */
        .auth-wrapper { width: 100%; max-width: 380px; padding: 24px; margin-top: 40px; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(16px); border-radius: 18px; border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; }
        .input-control { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; margin-bottom: 10px; }

        /* UI Elements */
        .card { background: rgba(10, 25, 41, 0.85); backdrop-filter: blur(12px); padding: 16px; border-radius: 14px; text-align: center; margin-bottom: 14px; border: 1px solid rgba(255, 215, 0, 0.2); }
        .card h1 { color: #fbbf24; font-size: 30px; font-family: monospace; margin: 5px 0; }
        .btn { width: 100%; padding: 14px; border-radius: 10px; border: none; background: linear-gradient(135deg, #0284c7, #0891b2); color: white; font-weight: 700; cursor: pointer; }
        
        .history-card { background-color: #ffffff; color: #0f172a; border-radius: 14px; padding: 16px; margin-top: 15px; }
        .history-table { width: 100%; border-collapse: collapse; font-size: 11px; }
        .history-table th { text-align: left; padding: 8px 4px; border-bottom: 1px solid #ccc; color: #666; }
        .history-table td { padding: 8px 4px; border-bottom: 1px solid #f1f5f9; }
        .p-profit { color: #16a34a; font-weight: bold; }

        .signature { text-align: center; font-size: 10px; color: #64748b; font-weight: bold; margin-top: 10px; }

        /* Modal Blur Effect */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); justify-content: center; align-items: center; z-index: 2000; }
        .modal-content { background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(15px); padding: 20px; border-radius: 16px; border: 1px solid #334155; width: 90%; max-width: 320px; text-align: center; }

        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(3, 20, 32, 0.95); backdrop-filter: blur(16px); display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #334155; }
        .nav-tab { color: #64748b; font-size: 10px; text-align: center; cursor: pointer; }
        .nav-tab.active { color: #38bdf8; }
    </style>
</head>
<body>

<div class="top-ticker"><div class="ticker-text">🚀 SPECIAL OFFER: DEPOSIT $200 AND GET AN INSTANT $5 BONUS! LIMITED TIME OFFER! 🚀</div></div>
<div class="bg-particles" id="stars-container"></div>

<!-- Auth Screen -->
<div class="auth-wrapper" id="auth-screen">
    <h2 style="color:#38bdf8">LOGIN / REGISTER</h2>
    <input type="text" id="reg-fname" class="input-control" placeholder="First Name">
    <input type="text" id="reg-lname" class="input-control" placeholder="Last Name">
    <input type="email" id="reg-email" class="input-control" placeholder="Email">
    <input type="tel" id="reg-phone" class="input-control" placeholder="Phone">
    <button class="btn" onclick="handleRegistration()">Get Started</button>
</div>

<!-- Main Dashboard -->
<div class="main-wrapper" id="main-dashboard" style="display:none;">
    <div class="card">
        <p id="active-asset-title">GOLD (XAU/USD) REAL-TIME</p>
        <h1 id="active-asset-price">$0.00</h1>
    </div>

    <div id="mining-section"><button class="btn" onclick="handleMiningClick()">🚀 MINE (15s CHART)</button></div>

    <div class="history-card">
        <div style="font-weight:800; font-size:14px; margin-bottom:10px;">⛏️ DAILY MINING HISTORY</div>
        <table class="history-table">
            <thead><tr><th>DATE</th><th>TYPE</th><th>ASSET</th><th>P/L</th></tr></thead>
            <tbody id="history-rows"></tbody>
        </table>
    </div>
    <div class="signature">Design by Ahmad Ejaz®</div>
</div>

<div class="bottom-nav" id="bottom-navbar">
    <div class="nav-tab" onclick="alert('Quotes Loaded')">📊<br>Quotes</div>
    <div class="nav-tab active">🚀<br>Mine</div>
    <div class="nav-tab" onclick="alert('History Loaded')">📜<br>History</div>
    <div class="nav-tab" onclick="handleLogout()">👤<br>Logout</div>
</div>

<div id="modal" class="modal">
    <div class="modal-content">
        <div id="modal-title" style="font-weight:bold; margin-bottom:10px;">Notice</div>
        <div id="modal-body" style="font-size:12px; margin-bottom:15px;"></div>
        <button class="btn" onclick="closePopup()" style="background:#dc2626;">Cancel</button>
    </div>
</div>

<script>
    // Stars
    const container = document.getElementById('stars-container');
    for(let i=0; i<40; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        star.style.width = Math.random()*3+'px'; star.style.height = star.style.width;
        star.style.top = Math.random()*100+'%'; star.style.left = Math.random()*100+'%';
        star.style.setProperty('--duration', (Math.random()*3+2)+'s');
        container.appendChild(star);
    }

    // Logic
    function handleRegistration() {
        const user = { name: document.getElementById('reg-fname').value };
        localStorage.setItem('traderUser', JSON.stringify(user));
        location.reload();
    }

    function handleLogout() { localStorage.clear(); location.reload(); }

    if(localStorage.getItem('traderUser')) {
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('main-dashboard').style.display = 'block';
        document.getElementById('bottom-navbar').style.display = 'flex';
        loadHistory();
    }

    function loadHistory() {
        let history = JSON.parse(localStorage.getItem('miningLogs')) || [];
        let rows = document.getElementById('history-rows');
        rows.innerHTML = history.length ? '' : '<tr><td colspan="4" style="text-align:center;">No history yet.</td></tr>';
        history.forEach(log => {
            rows.innerHTML += `<tr><td>${log.date}</td><td>MINE</td><td>GOLD</td><td class="p-profit">+$1.00</td></tr>`;
        });
    }

    function handleMiningClick() {
        let logs = JSON.parse(localStorage.getItem('miningLogs')) || [];
        logs.push({date: new Date().toLocaleDateString()});
        localStorage.setItem('miningLogs', JSON.stringify(logs));
        alert("Mining Success!");
        location.reload();
    }

    function showPopup(t, b) { document.getElementById('modal-title').innerText=t; document.getElementById('modal-body').innerText=b; document.getElementById('modal').style.display='flex'; }
    function closePopup() { document.getElementById('modal').style.display='none'; }
</script>
</body>
</html>
