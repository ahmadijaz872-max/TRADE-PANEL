<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Stake Panel</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background-color: #1e293b;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
    }

    header .logo {
      font-size: 1.25rem;
      font-weight: bold;
      color: #38bdf8;
    }

    nav {
      display: flex;
      gap: 1rem;
    }

    nav button {
      background: transparent;
      border: 1px solid #38bdf8;
      color: #38bdf8;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    nav button:hover, nav button.active {
      background-color: #38bdf8;
      color: #0f172a;
    }

    .container {
      flex: 1;
      padding: 2rem;
      max-width: 1000px;
      margin: 0 auto;
      width: 100%;
    }

    .page-section {
      display: none;
    }

    .page-section.active {
      display: block;
    }

    .card {
      background-color: #1e293b;
      padding: 1.5rem;
      border-radius: 10px;
      border: 1px solid #334155;
      margin-bottom: 1.5rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .card h2 {
      margin-bottom: 1rem;
      color: #38bdf8;
      font-size: 1.2rem;
      border-bottom: 1px solid #334155;
      padding-bottom: 0.5rem;
    }

    .grid-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .stat-box {
      background-color: #0f172a;
      padding: 1rem;
      border-radius: 8px;
      border: 1px solid #334155;
      text-align: center;
    }

    .stat-box span {
      font-size: 0.85rem;
      color: #94a3b8;
      display: block;
      margin-bottom: 0.25rem;
    }

    .stat-box h3 {
      font-size: 1.4rem;
      color: #f8fafc;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.4rem;
      color: #cbd5e1;
      font-size: 0.9rem;
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 0.75rem;
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #f8fafc;
      font-size: 0.95rem;
    }

    .form-group input:focus, .form-group select:focus {
      outline: none;
      border-color: #38bdf8;
    }

    .btn-submit {
      width: 100%;
      background-color: #38bdf8;
      color: #0f172a;
      padding: 0.75rem;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .btn-submit:hover {
      background-color: #0284c7;
      color: #ffffff;
    }

    .btn-submit:disabled {
      background-color: #64748b;
      cursor: not-allowed;
    }

    .profile-row {
      display: flex;
      justify-content: space-between;
      padding: 0.75rem 0;
      border-bottom: 1px solid #334155;
    }

    .profile-row:last-child {
      border-bottom: none;
    }

    .profile-label {
      color: #94a3b8;
    }

    .profile-value {
      font-weight: 600;
      color: #f8fafc;
    }

    #statusMessage {
      margin-top: 1rem;
      padding: 0.75rem;
      border-radius: 6px;
      display: none;
      font-size: 0.9rem;
    }

    .msg-success {
      background-color: #064e3b;
      color: #6ee7b7;
      border: 1px solid #047857;
    }

    .msg-error {
      background-color: #7f1d1d;
      color: #fca5a5;
      border: 1px solid #dc2626;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">Smart Stake Panel</div>
    <nav>
      <button id="btnHome" class="active" onclick="switchTab('homeSection', 'btnHome')">Home / Dashboard</button>
      <button id="btnProfile" onclick="switchTab('profileSection', 'btnProfile')">Profile</button>
    </nav>
  </header>

  <div class="container">

    <!-- HOME / DASHBOARD SECTION (Sign-Up card completely removed) -->
    <div id="homeSection" class="page-section active">
      
      <div class="grid-stats">
        <div class="stat-box">
          <span>Active Balance</span>
          <h3 id="dashBalance">$0.00</h3>
        </div>
        <div class="stat-box">
          <span>Total Mined</span>
          <h3 id="dashMined">$0.00</h3>
        </div>
        <div class="stat-box">
          <span>Eligible Withdrawal</span>
          <h3 id="dashWithdraw">$0.00</h3>
        </div>
      </div>

      <div class="card">
        <h2>Quick Action Request</h2>
        <form id="actionForm" onsubmit="handleActionSubmit(event)">
          <div class="form-group">
            <label for="actionType">Select Action</label>
            <select id="actionType" required>
              <option value="DEPOSIT_PENDING">Deposit Request</option>
              <option value="WITHDRAW_PENDING">Withdrawal Request</option>
            </select>
          </div>

          <div class="form-group">
            <label for="actionAmount">Amount ($)</label>
            <input type="number" id="actionAmount" min="1" step="any" placeholder="Enter amount" required>
          </div>

          <div class="form-group">
            <label for="txHash">TxID / Hash Reference</label>
            <input type="text" id="txHash" placeholder="Enter transaction ID or Hash" required>
          </div>

          <div class="form-group">
            <label for="screenshotUrl">Proof Screenshot URL</label>
            <input type="url" id="screenshotUrl" placeholder="https://drive.google.com/..." required>
          </div>

          <button type="submit" id="btnSubmitAction" class="btn-submit">Submit Request</button>
        </form>
        <div id="statusMessage"></div>
      </div>

    </div>

    <!-- PROFILE SECTION (Maintains full User Registration & Sheet Sync Flow) -->
    <div id="profileSection" class="page-section">
      
      <div class="card">
        <h2>User Account Profile</h2>
        <div class="profile-row">
          <span class="profile-label">Full Name</span>
          <span class="profile-value" id="profName">--</span>
        </div>
        <div class="profile-row">
          <span class="profile-label">Email Address</span>
          <span class="profile-value" id="profEmail">--</span>
        </div>
        <div class="profile-row">
          <span class="profile-label">Phone Number</span>
          <span class="profile-value" id="profPhone">--</span>
        </div>
        <div class="profile-row">
          <span class="profile-label">Account Status</span>
          <span class="profile-value" id="profStatus" style="color:#38bdf8;">--</span>
        </div>
      </div>

      <div class="card">
        <h2>Register / Update User Information</h2>
        <form id="profileForm" onsubmit="handleProfileSubmit(event)">
          <div class="form-group">
            <label for="regName">Full Name</label>
            <input type="text" id="regName" placeholder="Enter your full name" required>
          </div>

          <div class="form-group">
            <label for="regEmail">Email Address</label>
            <input type="email" id="regEmail" placeholder="Enter your email address" required>
          </div>

          <div class="form-group">
            <label for="regPhone">Phone Number</label>
            <input type="tel" id="regPhone" placeholder="923000000000" required>
          </div>

          <button type="submit" id="btnSaveProfile" class="btn-submit">Register / Save Profile</button>
        </form>
      </div>

    </div>

  </div>

  <script>
    // Replace with your Google Web App URL
    const SCRIPT_URL = "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL";

    function switchTab(sectionId, btnId) {
      document.querySelectorAll('.page-section').forEach(sec => sec.classList.remove('active'));
      document.querySelectorAll('nav button').forEach(btn => btn.classList.remove('active'));

      document.getElementById(sectionId).classList.add('active');
      document.getElementById(btnId).classList.add('active');
    }

    function showStatus(msg, isError = false) {
      const statusEl = document.getElementById('statusMessage');
      statusEl.style.display = 'block';
      statusEl.innerText = msg;
      statusEl.className = isError ? 'msg-error' : 'msg-success';
    }

    // Handle Profile Registration / Update
    async function handleProfileSubmit(event) {
      event.preventDefault();
      
      const btn = document.getElementById('btnSaveProfile');
      btn.disabled = true;
      btn.innerText = 'Processing...';

      const payload = {
        action: 'REGISTERED',
        name: document.getElementById('regName').value,
        email: document.getElementById('regEmail').value,
        phone: document.getElementById('regPhone').value
      };

      try {
        if (SCRIPT_URL !== "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL") {
          await fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
        }

        // Update Local Storage & UI
        localStorage.setItem('userProfile', JSON.stringify(payload));
        updateProfileUI(payload.name, payload.email, payload.phone, 'Active');
        alert('User profile registered/updated successfully!');

      } catch (err) {
        console.error(err);
        alert('Error registering user.');
      } finally {
        btn.disabled = false;
        btn.innerText = 'Register / Save Profile';
      }
    }

    // Handle Deposit / Withdraw Submission
    async function handleActionSubmit(event) {
      event.preventDefault();

      const btn = document.getElementById('btnSubmitAction');
      btn.disabled = true;
      btn.innerText = 'Submitting...';

      const savedUser = JSON.parse(localStorage.getItem('userProfile') || '{}');

      const payload = {
        action: document.getElementById('actionType').value,
        amount: document.getElementById('actionAmount').value,
        txHash: document.getElementById('txHash').value,
        screenshot: document.getElementById('screenshotUrl').value,
        name: savedUser.name || 'Anonymous User',
        email: savedUser.email || 'N/A',
        phone: savedUser.phone || 'N/A'
      };

      try {
        if (SCRIPT_URL !== "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL") {
          await fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
        }

        showStatus('Request submitted successfully! Pending approval.');
        document.getElementById('actionForm').reset();

      } catch (err) {
        showStatus('Failed to submit request.', true);
      } finally {
        btn.disabled = false;
        btn.innerText = 'Submit Request';
      }
    }

    function updateProfileUI(name, email, phone, status) {
      document.getElementById('profName').innerText = name || '--';
      document.getElementById('profEmail').innerText = email || '--';
      document.getElementById('profPhone').innerText = phone || '--';
      document.getElementById('profStatus').innerText = status || 'Inactive';

      document.getElementById('regName').value = name || '';
      document.getElementById('regEmail').value = email || '';
      document.getElementById('regPhone').value = phone || '';
    }

    // Auto-load saved user on startup
    window.addEventListener('DOMContentLoaded', () => {
      const savedUser = JSON.parse(localStorage.getItem('userProfile') || 'null');
      if (savedUser) {
        updateProfileUI(savedUser.name, savedUser.email, savedUser.phone, 'Active');
      }
    });
  </script>
</body>
</html>
