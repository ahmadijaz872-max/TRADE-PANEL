<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Stake Panel</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .card { background: #1e293b; width: 100%; max-width: 480px; padding: 25px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #334155; }
    h2 { text-align: center; color: #38bdf8; margin-bottom: 20px; font-size: 22px; font-weight: 600; }
    
    .tab-buttons { display: flex; gap: 8px; margin-bottom: 20px; border-bottom: 1px solid #334155; padding-bottom: 10px; }
    .tab-btn { flex: 1; padding: 10px; background: #334155; border: none; color: #94a3b8; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.3s; }
    .tab-btn.active { background: #38bdf8; color: #0f172a; }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .balance-box { background: #0f172a; padding: 15px; border-radius: 8px; border: 1px solid #334155; margin-bottom: 15px; }
    .balance-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; color: #94a3b8; }
    .balance-row span.val { color: #38bdf8; font-weight: bold; font-size: 16px; }

    .form-group { margin-bottom: 15px; }
    label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 5px; }
    input { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #fff; font-size: 14px; outline: none; }
    input:focus { border-color: #38bdf8; }

    button.btn-submit { width: 100%; padding: 12px; background: #38bdf8; color: #0f172a; border: none; border-radius: 6px; font-weight: bold; font-size: 15px; cursor: pointer; margin-top: 10px; transition: 0.2s; }
    button.btn-submit:hover { background: #0284c7; color: #fff; }

    .error-msg { color: #ef4444; font-size: 13px; margin-top: 8px; display: none; text-align: center; }
    .success-msg { color: #22c55e; font-size: 13px; margin-top: 8px; display: none; text-align: center; }
  </style>
</head>
<body>

<div class="card">
  <h2>Smart Stake Panel</h2>

  <div class="tab-buttons">
    <button class="tab-btn active" onclick="switchTab('dashboard')">Dashboard</button>
    <button class="tab-btn" onclick="switchTab('deposit')">Deposit</button>
    <button class="tab-btn" onclick="switchTab('withdraw')">Withdraw</button>
    <button class="tab-btn" onclick="switchTab('register')">Register</button>
  </div>

  <!-- DASHBOARD TAB -->
  <div id="dashboard" class="tab-content active">
    <div class="form-group">
      <label>Enter Registered Email</label>
      <input type="email" id="dashEmail" placeholder="user@example.com">
      <button class="btn-submit" onclick="fetchUserData()">Check Balance</button>
    </div>

    <div class="balance-box">
      <div class="balance-row">
        <span>Approved Deposit:</span>
        <span class="val" id="depBal">$0.00</span>
      </div>
      <div class="balance-row">
        <span>Current Balance:</span>
        <span class="val" id="currBal">$0.00</span>
      </div>
    </div>
  </div>

  <!-- DEPOSIT TAB -->
  <div id="deposit" class="tab-content">
    <form id="depositForm" onsubmit="handleDepositSubmit(event)">
      <div class="form-group">
        <label>User Email *</label>
        <input type="email" id="depEmail" placeholder="Your account email" required>
      </div>

      <div class="form-group">
        <label>Amount ($) *</label>
        <input type="number" id="depAmount" min="1" step="any" placeholder="Enter deposit amount" required>
      </div>

      <div class="form-group">
        <label>TxID / Hash *</label>
        <input type="text" id="depTxid" placeholder="Transaction Hash" required>
      </div>

      <div class="form-group">
        <label>Screenshot Link / Data *</label>
        <input type="text" id="depScreenshot" placeholder="Paste image link or data" required>
      </div>

      <div id="depError" class="error-msg">Amount, TxID, aur Screenshot teeno fill karna lazmi hain.</div>
      <div id="depSuccess" class="success-msg">Deposit Request Submitted Successfully!</div>

      <button type="submit" id="depBtn" class="btn-submit">Submit Deposit Request</button>
    </form>
  </div>

  <!-- WITHDRAWAL TAB -->
  <div id="withdraw" class="tab-content">
    <form id="withdrawForm" onsubmit="handleWithdrawSubmit(event)">
      <div class="form-group">
        <label>User Email *</label>
        <input type="email" id="wdEmail" placeholder="Your account email" required>
      </div>

      <div class="form-group">
        <label>Amount ($) *</label>
        <input type="number" id="wdAmount" min="1" step="any" placeholder="Enter amount" required>
      </div>

      <div class="form-group">
        <label>Network *</label>
        <input type="text" id="wdNetwork" placeholder="TRC20 / BEP20 / USDT" required>
      </div>

      <div class="form-group">
        <label>Wallet Address *</label>
        <input type="text" id="wdAddress" placeholder="Your wallet address" required>
      </div>

      <div id="wdSuccess" class="success-msg">Withdrawal Request Submitted!</div>

      <button type="submit" id="wdBtn" class="btn-submit">Submit Withdrawal</button>
    </form>
  </div>

  <!-- REGISTER TAB -->
  <div id="register" class="tab-content">
    <form id="regForm" onsubmit="handleRegisterSubmit(event)">
      <div class="form-group">
        <label>Full Name *</label>
        <input type="text" id="regName" placeholder="Full Name" required>
      </div>

      <div class="form-group">
        <label>Email *</label>
        <input type="email" id="regEmail" placeholder="Email Address" required>
      </div>

      <div class="form-group">
        <label>Phone *</label>
        <input type="text" id="regPhone" placeholder="Phone Number" required>
      </div>

      <div class="form-group">
        <label>Ref Code</label>
        <input type="text" id="regRefCode" placeholder="Your Referral Code">
      </div>

      <div class="form-group">
        <label>Referred By</label>
        <input type="text" id="regReferredBy" placeholder="Sponsor Code (Optional)">
      </div>

      <div id="regSuccess" class="success-msg">Registration Successful!</div>

      <button type="submit" id="regBtn" class="btn-submit">Register Account</button>
    </form>
  </div>

</div>

<script>
  const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwSRP8pT1qIvWw5cSJ3gJKiqkz4NQEPmCwqUaioeJi7N2hewBipsmW3J2WbRCj02hpPJg/exec";

  function switchTab(tabId) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    
    document.getElementById(tabId).classList.add('active');
    event.currentTarget.classList.add('active');
  }

  function fetchUserData() {
    const email = document.getElementById('dashEmail').value.trim();
    if (!email) {
      alert("Email enter karein");
      return;
    }

    fetch(GOOGLE_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action_type: "fetch_user_data", email: email })
    })
    .then(res => res.json())
    .then(data => {
      if (data.status === "success") {
        document.getElementById('depBal').innerText = "$" + (data.depositBal || 0).toFixed(2);
        document.getElementById('currBal').innerText = "$" + (data.currentBal || 0).toFixed(2);
      } else {
        alert("User data fetch nahi ho saka");
      }
    })
    .catch(err => {
      alert("Error fetching balance: " + err);
    });
  }

  function handleDepositSubmit(e) {
    e.preventDefault();
    
    const email = document.getElementById('depEmail').value.trim();
    const amount = document.getElementById('depAmount').value.trim();
    const txid = document.getElementById('depTxid').value.trim();
    const screenshot = document.getElementById('depScreenshot').value.trim();
    
    const errBox = document.getElementById('depError');
    const successBox = document.getElementById('depSuccess');

    if (!email || !amount || !txid || !screenshot) {
      errBox.style.display = 'block';
      successBox.style.display = 'none';
      return;
    }

    errBox.style.display = 'none';
    const btn = document.getElementById('depBtn');
    btn.innerText = "Submitting...";
    btn.disabled = true;

    const payload = {
      action_type: "request_deposit",
      email: email,
      amount: amount,
      txid: txid,
      screenshot: screenshot
    };

    fetch(GOOGLE_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    })
    .then(() => {
      successBox.style.display = 'block';
      document.getElementById('depositForm').reset();
      btn.innerText = "Submit Deposit Request";
      btn.disabled = false;
    })
    .catch(err => {
      alert("Submission Error: " + err);
      btn.innerText = "Submit Deposit Request";
      btn.disabled = false;
    });
  }

  function handleWithdrawSubmit(e) {
    e.preventDefault();
    
    const btn = document.getElementById('wdBtn');
    btn.innerText = "Submitting...";
    btn.disabled = true;

    const payload = {
      action_type: "request_withdrawal",
      email: document.getElementById('wdEmail').value.trim(),
      amount: document.getElementById('wdAmount').value.trim(),
      network: document.getElementById('wdNetwork').value.trim(),
      address: document.getElementById('wdAddress').value.trim()
    };

    fetch(GOOGLE_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    })
    .then(() => {
      document.getElementById('wdSuccess').style.display = 'block';
      document.getElementById('withdrawForm').reset();
      btn.innerText = "Submit Withdrawal";
      btn.disabled = false;
    })
    .catch(err => {
      alert("Error: " + err);
      btn.innerText = "Submit Withdrawal";
      btn.disabled = false;
    });
  }

  function handleRegisterSubmit(e) {
    e.preventDefault();

    const btn = document.getElementById('regBtn');
    btn.innerText = "Registering...";
    btn.disabled = true;

    const payload = {
      action_type: "register",
      name: document.getElementById('regName').value.trim(),
      email: document.getElementById('regEmail').value.trim(),
      phone: document.getElementById('regPhone').value.trim(),
      ref_code: document.getElementById('regRefCode').value.trim(),
      referred_by: document.getElementById('regReferredBy').value.trim()
    };

    fetch(GOOGLE_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    })
    .then(() => {
      document.getElementById('regSuccess').style.display = 'block';
      document.getElementById('regForm').reset();
      btn.innerText = "Register Account";
      btn.disabled = false;
    })
    .catch(err => {
      alert("Error: " + err);
      btn.innerText = "Register Account";
      btn.disabled = false;
    });
  }
</script>

</body>
</html>
