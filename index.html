<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Stake Panel</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0d1117; color: #c9d1d9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
    .card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 24px; width: 100%; max-width: 450px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
    h2 { text-align: center; color: #58a6ff; margin-bottom: 20px; font-size: 22px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-size: 13px; color: #8b949e; }
    input { width: 100%; padding: 10px 12px; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: #fff; font-size: 14px; outline: none; }
    input:focus { border-color: #58a6ff; }
    button { width: 100%; padding: 12px; background: #238636; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; margin-top: 10px; transition: 0.2s; }
    button:hover { background: #2ea043; }
    .btn-secondary { background: #21262d; border: 1px solid #30363d; }
    .btn-secondary:hover { background: #30363d; }
    .hidden { display: none; }
    .msg-box { margin-top: 15px; padding: 10px; border-radius: 6px; font-size: 13px; text-align: center; }
    .success { background: rgba(46, 160, 67, 0.15); color: #3fb950; border: 1px solid #238636; }
    .error { background: rgba(248, 81, 73, 0.15); color: #f85149; border: 1px solid #da3633; }
    .info-box { background: #21262d; padding: 12px; border-radius: 6px; margin-bottom: 15px; font-size: 13px; }
  </style>
</head>
<body>

<div class="card">
  <!-- 1. SIGNUP FORM -->
  <div id="signupSection">
    <h2>Smart Stake Panel - Signup</h2>
    <div class="form-group">
      <label>Full Name</label>
      <input type="text" id="regName" placeholder="Enter Full Name">
    </div>
    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="regEmail" placeholder="name@example.com">
    </div>
    <div class="form-group">
      <label>Phone Number</label>
      <input type="text" id="regPhone" placeholder="03001234567">
    </div>
    <button onclick="registerUser()">Register Account</button>
  </div>

  <!-- 2. DASHBOARD / ACTIONS -->
  <div id="dashboardSection" class="hidden">
    <h2>User Dashboard</h2>
    <div class="info-box">
      <div><strong>Status:</strong> <span id="userStatus">Checking...</span></div>
      <div><strong>Deposit Amount:</strong> <span id="userDeposit">$0.00</span></div>
    </div>

    <!-- Deposit Proof Form -->
    <div class="form-group">
      <label>Deposit Amount ($)</label>
      <input type="number" id="depAmount" placeholder="10.00">
    </div>
    <div class="form-group">
      <label>Transaction ID (TxID)</label>
      <input type="text" id="depTxid" placeholder="Enter TxID / Hash">
    </div>
    <div class="form-group">
      <label>Receipt Screenshot</label>
      <input type="file" id="depScreenshot" accept="image/*">
    </div>
    <button onclick="submitDeposit()">Submit Deposit Proof</button>
    <button class="btn-secondary" onclick="triggerMining()">Add Mining Profit ($1.00)</button>
    <button class="btn-secondary" onclick="requestWithdrawal()">Request Withdrawal</button>
  </div>

  <div id="statusMsg" class="msg-box hidden"></div>
</div>

<script>
  // Web App Deployment URL
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzVYmxFwN6WcoSG65aab8Ysw4SMjBA79KivVHPIwXol8hh9ki8zuuEI2C4AWaQFRpRQtw/exec";

  // Global User Session State
  let currentUser = { name: "", email: "", phone: "" };

  function showMessage(msg, isError = false) {
    const box = document.getElementById("statusMsg");
    box.className = "msg-box " + (isError ? "error" : "success");
    box.innerText = msg;
    box.classList.remove("hidden");
  }

  // Generic POST Request Handler
  async function sendApiRequest(payload) {
    try {
      const response = await fetch(WEB_APP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      return await response.json();
    } catch (err) {
      console.error("API Request Error:", err);
      return { result: "error", error: err.toString() };
    }
  }

  // 1. SIGNUP FUNCTION
  async function registerUser() {
    const name = document.getElementById("regName").value.trim();
    const email = document.getElementById("regEmail").value.trim().toLowerCase();
    const phone = document.getElementById("regPhone").value.trim();

    if (!name || !email || !phone) {
      showMessage("Please fill all fields!", true);
      return;
    }

    showMessage("Processing Registration...");

    const payload = {
      action: "SIGNUP",
      name: name,
      email: email,
      phone: phone
    };

    const res = await sendApiRequest(payload);

    if (res.result === "success") {
      currentUser = { name, email, phone };
      showMessage("Registration Successful!");
      openDashboard();
    } else if (res.result === "exists") {
      currentUser = { name, email, phone };
      showMessage("User already registered. Loading Dashboard...");
      openDashboard();
    } else {
      showMessage("Registration Failed: " + (res.error || "Unknown Error"), true);
    }
  }

  // 2. DASHBOARD & CHECK STATUS
  async function openDashboard() {
    document.getElementById("signupSection").classList.add("hidden");
    document.getElementById("dashboardSection").classList.remove("hidden");
    
    startHeartbeat();
    checkAccountStatus();
  }

  async function checkAccountStatus() {
    try {
      const url = `${WEB_APP_URL}?email=${encodeURIComponent(currentUser.email)}&phone=${encodeURIComponent(currentUser.phone)}`;
      const res = await fetch(url).then(r => r.json());

      if (res.result === "success") {
        document.getElementById("userStatus").innerText = res.isApproved ? "Approved / Active" : "Pending Approval";
        document.getElementById("userDeposit").innerText = "$" + res.depositAmount.toFixed(2);
      }
    } catch (e) {
      console.error("Status Check Error:", e);
    }
  }

  // 3. DEPOSIT PROOF SUBMISSION WITH IMAGE CONVERSION
  async function submitDeposit() {
    const amount = document.getElementById("depAmount").value;
    const txid = document.getElementById("depTxid").value;
    const fileInput = document.getElementById("depScreenshot");

    if (!amount || !txid) {
      showMessage("Please enter amount and TxID", true);
      return;
    }

    let base64Image = "";
    if (fileInput.files.length > 0) {
      const file = fileInput.files[0];
      base64Image = await new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = e => resolve(e.target.result);
        reader.readAsDataURL(file);
      });
    }

    showMessage("Submitting Deposit Proof...");

    const payload = {
      action: "DEPOSIT_PROOF_SUBMITTED",
      name: currentUser.name,
      email: currentUser.email,
      phone: currentUser.phone,
      amount: "$" + parseFloat(amount).toFixed(2),
      txid: txid,
      screenshot: base64Image
    };

    const res = await sendApiRequest(payload);
    if (res.result === "success") {
      showMessage("Deposit Proof Submitted Successfully!");
      checkAccountStatus();
    } else {
      showMessage("Deposit Submission Failed", true);
    }
  }

  // 4. MINING PROFIT
  async function triggerMining() {
    showMessage("Updating Mining Profit...");
    const res = await sendApiRequest({
      action: "MINING_PROFIT",
      email: currentUser.email,
      phone: currentUser.phone
    });

    if (res.result === "success") {
      showMessage("Mining Profit Added ($1.00)!");
    } else {
      showMessage("Failed to add Mining Profit", true);
    }
  }

  // 5. WITHDRAWAL REQUEST
  async function requestWithdrawal() {
    const txid = prompt("Enter your Wallet Address for Withdrawal:");
    if (!txid) return;

    showMessage("Sending Withdrawal Request...");
    const res = await sendApiRequest({
      action: "WITHDRAWAL_REQUEST",
      email: currentUser.email,
      phone: currentUser.phone,
      txid: txid
    });

    if (res.result === "success") {
      showMessage("Withdrawal Requested Successfully!");
    } else {
      showMessage("Withdrawal Request Failed", true);
    }
  }

  // 6. HEARTBEAT ACTIVE TRACKING
  function startHeartbeat() {
    // Send active pulse every 2 minutes
    setInterval(() => {
      if (currentUser.email) {
        sendApiRequest({
          action: "HEARTBEAT_ACTIVE",
          email: currentUser.email,
          phone: currentUser.phone
        });
      }
    }, 120000);

    // Initial heartbeat
    sendApiRequest({
      action: "HEARTBEAT_ACTIVE",
      email: currentUser.email,
      phone: currentUser.phone
    });
  }
</script>

</body>
</html>
